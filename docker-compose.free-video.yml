name: grok2api-free-video-20269

services:
  grok2api-free-video:
    container_name: grok2api-free-video-20269
    image: "${GROK2API_IMAGE:-ghcr.io/orangewoker/grok2api:latest}"
    pull_policy: always
    ports:
      - "${GROK2API_PORT:-20269}:8000"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # 非空时覆盖 config.yaml 的 PostgreSQL DSN，并自动启用 postgres。
      GROK2API_DATABASE_URL: "${GROK2API_DATABASE_URL:-}"
      GROK2API_QUALITY_GUARD_DIR: /var/lib/grok2api-quality-guard
    volumes:
      - "${GROK2API_CONFIG:-./config.yaml}:/run/grok2api/config.yaml:ro"
      - grok2api-free-video-20269-data:/app/data
      - grok2api-free-video-20269-quality-guard:/var/lib/grok2api-quality-guard
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    security_opt:
      - no-new-privileges:true

  # 自动跟踪 GHCR 的 latest 镜像并在有新摘要时重启上面的服务。
  watchtower:
    container_name: grok2api-free-video-20269-watchtower
    image: containrrr/watchtower:latest
    command:
      - --label-enable
      - --interval=300
      - --cleanup
      - --rolling-restart
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

volumes:
  grok2api-free-video-20269-data:
  grok2api-free-video-20269-quality-guard:
